<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI 모의 fetch 테스트 · Gemini 429 폴백 · Groq · OpenRouter</title>
<style>
  body{ font-family:ui-monospace,SFMono-Regular,Menlo,monospace; background:#0f1117; color:#d7dcea; padding:18px; font-size:12.5px; line-height:1.5; }
  h1{ font-size:15px; margin:0 0 10px; }
  pre{ white-space:pre-wrap; word-break:break-all; background:#161a24; border:1px solid #263048; border-radius:10px; padding:14px; }
  .ok{ color:#5ce89a; } .bad{ color:#ff7b7b; }
</style>
</head>
<body>
<h1>AI 모의 fetch 테스트 (Gemini 429 폴백 · Groq · OpenRouter)</h1>
<pre id="out">실행 중…</pre>
<script type="module">
const out = document.getElementById('out');
const backup = {};
for (let i = 0; i < localStorage.length; i++) {
  const k = localStorage.key(i);
  if (k && k.startsWith('aitutor.')) backup[k] = localStorage.getItem(k);
}
const realFetch = window.fetch;
let calls = [];
const log = [];
const json = (status, obj) => new Response(JSON.stringify(obj), { status, headers: { 'Content-Type': 'application/json' } });
const check = (name, cond, detail) => { log.push({ name, pass: !!cond, detail }); };
const gemText = JSON.stringify({
  unitTitle: '공통수학 1 · 이차방정식',
  curriculumName: '2022 개정 교육과정 · 공통수학 1',
  topics: [{ title: '복소수와 이차방정식', focus: '근의 공식' }, { title: '판별식', focus: '근의 판별' }],
  confirmed: true,
});
function geminiMock({ groundingStatus = 200 } = {}) {
  return async (url, opts) => {
    const u = String(url);
    let body = null; try { body = opts && opts.body ? JSON.parse(opts.body) : null; } catch (e) {}
    if (!u.includes('generativelanguage')) return json(404, { error: { message: 'unmocked ' + u } });
    calls.push({ kind: 'gemini', tools: !!(body && body.tools), model: body && body.model });
    if (body && body.tools && groundingStatus !== 200) {
      return json(groundingStatus, { error: { code: groundingStatus, message: 'Resource exhausted: google_search quota' } });
    }
    return json(200, { candidates: [{ content: { parts: [{ text: gemText }] } }] });
  };
}
function openaiMock(kind) {
  return async (url, opts) => {
    const u = String(url);
    let body = null; try { body = opts && opts.body ? JSON.parse(opts.body) : null; } catch (e) {}
    const host = kind === 'groq' ? 'api.groq.com' : 'openrouter.ai/api';
    if (!u.includes(host)) return json(404, { error: { message: 'unmocked ' + u } });
    calls.push({ kind, model: body && body.model, stream: !!(body && body.stream), img: JSON.stringify((body && body.messages) || '').includes('image_url') });
    if (u.includes('/models')) {
      return json(200, { data: kind === 'groq'
        ? [{ id: 'llama-3.3-70b-versatile' }, { id: 'llama-3.1-8b-instant' }]
        : [{ id: 'meta-llama/llama-3.3-70b-instruct:free' }, { id: 'google/gemma-3-27b-it:free' }] });
    }
    const text = kind === 'groq'
      ? '{"unitTitle":"공통수학 1 · Groq 단원","curriculumName":"2022 개정 · 공통수학 1","topics":[{"title":"다항식","focus":"연산"}]}'
      : '{"unitTitle":"공통수학 1 · OpenRouter 단원","curriculumName":"2022 개정 · 공통수학 1","topics":[{"title":"방정식","focus":"근"}]}';
    if (body && body.stream) {
      return new Response('data: {"choices":[{"delta":{"content":"안"}}]}\n\ndata: {"choices":[{"delta":[{"content":"녕"}]}}]}\n\ndata: {"choices":[{"delta":{"content":"녕"}}]}\n\ndata: [DONE]\n\n',
        { status: 200, headers: { 'Content-Type': 'text/event-stream' } });
    }
    return json(200, { choices: [{ message: { content: text } }] });
  };
}

try {
  // 캐시(max-age=600)에 걸리지 않도록 실행 시각을 붙여 새 모듈을 받는다
  const b = Date.now();
  const ai = await import(`../js/ai.js?t=${b}`);
  const core = await import(`../js/core.js?t=${b}`);
  const cur1 = await import(`../js/curriculum.js?t=1-${b}`);
  const cur2 = await import(`../js/curriculum.js?t=2-${b}`);

  /* A) Gemini: 검색 grounding 429 → 검색 없는 일반 generateContent 1회 폴백 */
  window.fetch = geminiMock({ groundingStatus: 429 });
  ai.setProvider('gemini');
  ai.setKeyFor('gemini', 'AIzaMOCKKEY00000000000000000000000');
  calls = [];
  const a = await cur1.buildCurriculum('math', { textbook: '공통수학 1', publisher: '비상교육' });
  check('A1 검색 grounding 429 → 일반 호출 폴백 성공', a.source === 'ai' && a.grounded === false, { source: a.source, grounded: a.grounded, unit: a.unitTitle });
  check('A2 검색은 1회만 시도(모델 갈아타기 없음)', calls.filter(c => c.tools).length === 1, calls.map(c => (c.tools ? 'grounding' : 'plain')));
  check('A3 폴백 호출은 검색 도구 없이 보냄', calls.filter(c => !c.tools).length >= 1, calls.length);
  check('A4 검색 생략 표시(searchSkipped)', a.searchSkipped === true, a.searchSkipped);

  /* B) Gemini 전체 429 → 기본 교육과정 + 안내 문구, 다음 과목은 요청 없이 기본 */
  window.fetch = geminiMock({ groundingStatus: 429 });
  window.fetch = async (url, opts) => {
    if (String(url).includes('generativelanguage')) {
      let b = null; try { b = JSON.parse(opts.body); } catch (e) {}
      calls.push({ kind: 'gemini', tools: !!(b && b.tools) });
      return json(429, { error: { code: 429, message: 'quota exceeded' } });
    }
    return json(404, {});
  };
  calls = [];
  const b1 = await cur2.buildCurriculum('math');
  const afterFirst = calls.length;
  const b2 = await cur2.buildCurriculum('english');
  check('B1 전체 429 → 기본 교육과정으로 채움', b1.source === 'basic' && b1.topics.length > 0, { source: b1.source, reason: b1.reason, topics: b1.topics.length });
  check('B2 429 안내 문구 제공', /Google 검색 무료 한도/.test(b1.fallbackNotice || ''), b1.fallbackNotice);
  check('B3 429 뒤에는 재시도를 멈추고 요청 없이 기본 카드', calls.length === afterFirst && b2.source === 'basic', { first: afterFirst, total: calls.length, second: b2.source });

  /* B-2) 학교 확인도 전체 429 → 기본 요약 + 안내 */
  const cur3 = await import(`../js/curriculum.js?t=3-${b}`);
  calls = [];
  const sc = await cur3.verifySchool({ school: '세일고등학교', level: '고등학교', grade: '1학년', semester: '1학기' });
  check('B4 학교 확인 전체 429 → 기본 요약 + 안내', sc.source === 'basic' && /Google 검색 무료 한도/.test(sc.fallbackNotice || ''), { source: sc.source, reason: sc.reason, note: sc.note });

  /* C) Groq: 검색 없이 chat/completions, JSON 파싱 */
  window.fetch = openaiMock('groq');
  ai.setProvider('groq');
  ai.setKeyFor('groq', 'gsk_mockkey123');
  calls = [];
  const c = await cur1.buildCurriculum('math', { textbook: '공통수학 1' });
  check('C1 Groq 단원 확인 성공', c.source === 'ai' && /Groq/.test(c.unitTitle || ''), { unit: c.unitTitle, source: c.source });
  check('C2 Groq 은 검색 도구 없이 Groq API로 호출', calls.length > 0 && calls.every(x => x.kind === 'groq' && !x.tools), calls.map(x => x.model));

  /* D) OpenRouter */
  window.fetch = openaiMock('openrouter');
  ai.setProvider('openrouter');
  ai.setKeyFor('openrouter', 'sk-or-v1-mock');
  calls = [];
  const d = await cur1.buildCurriculum('math');
  check('D1 OpenRouter 단원 확인 성공', d.source === 'ai' && /OpenRouter/.test(d.unitTitle || ''), { unit: d.unitTitle, source: d.source });
  check('D2 OpenRouter 모델(:free) 사용', calls.every(x => /:free|llama|gemma/i.test(x.model || '')), calls.map(x => x.model));

  /* E) Groq 스트리밍 + 사진(비전) 모델 */
  window.fetch = openaiMock('groq');
  ai.setProvider('groq');
  calls = [];
  let acc = '';
  const used = await ai.streamChat({ system: '테스트', parts: [{ text: 'hi' }], onChunk: (x) => { acc += x; } });
  check('E1 Groq 스트리밍 채팅 동작', acc === '안녕' && !!used, { used, acc });
  calls = [];
  await ai.generateText({ parts: [{ text: '이 문제 봐줘' }, { inline_data: { mime_type: 'image/jpeg', data: 'AAAA' } }] });
  check('E2 사진 첨부 시 비전 모델 선택', !!calls[0] && calls[0].img === true, calls[0]);

  /* F) 연결 테스트 3종 */
  window.fetch = async (url) => {
    const u = String(url);
    if (u.includes('generativelanguage') && u.includes(':generateContent')) return json(200, { candidates: [{ content: { parts: [{ text: 'ok' }] } }] });
    if (u.includes('generativelanguage') && u.includes('/models')) return json(200, { models: [{ name: 'models/gemini-2.5-flash', supportedGenerationMethods: ['generateContent'] }] });
    if (u.includes('api.groq.com') && u.includes('/models')) return json(200, { data: [{ id: 'llama-3.3-70b-versatile' }] });
    if (u.includes('api.groq.com')) return json(200, { choices: [{ message: { content: 'ok' } }] });
    if (u.includes('openrouter.ai/api/models')) return json(200, { data: [{ id: 'meta-llama/llama-3.3-70b-instruct:free' }] });
    if (u.includes('openrouter.ai/api')) return json(200, { choices: [{ message: { content: 'ok' } }] });
    return json(404, {});
  };
  const connects = {};
  for (const p of ['gemini', 'groq', 'openrouter']) {
    const k = p === 'gemini' ? 'AIzaMOCKKEY00000000000000000000000' : p === 'groq' ? 'gsk_mockkey123' : 'sk-or-v1-mock';
    try { connects[p] = (await ai.connectTest(k, () => {}, p)).model; } catch (e) { connects[p] = 'ERR ' + e.message; }
  }
  check('F1 연결 테스트 3종 성공', Object.values(connects).every(v => v && !String(v).startsWith('ERR')), connects);

  /* G) generateJSON 3종 (퀴즈·카드·계획 등 공통 경로) */
  window.fetch = async (url, opts) => {
    const u = String(url);
    let b = null; try { b = JSON.parse(opts.body); } catch (e) {}
    if (u.includes('generativelanguage')) return json(200, { candidates: [{ content: { parts: [{ text: '{"a":"ok"}' }] } }] });
    if (u.includes('api.groq.com') || u.includes('openrouter.ai/api')) return json(200, { choices: [{ message: { content: '{"a":"ok"}' } }] });
    return json(404, {});
  };
  const gj = {};
  for (const p of ['gemini', 'groq', 'openrouter']) {
    ai.setProvider(p);
    try { const j = await core.generateJSON({ system: 'JSON으로 답해', parts: [{ text: 'x' }], schema: { type: 'object', properties: { a: { type: 'string' } } } }); gj[p] = j.a; }
    catch (e) { gj[p] = 'ERR ' + e.message; }
  }
  check('G1 JSON 생성 3종 파싱 성공', Object.values(gj).every(v => v === 'ok'), gj);

  /* H) 잘못된 키 오류 문구 */
  window.fetch = async () => json(401, { error: { message: 'Invalid API key' } });
  ai.setProvider('groq');
  let errMsg = '';
  try { await ai.generateText({ parts: [{ text: 'x' }] }); } catch (e) { errMsg = e.message; }
  check('H1 잘못된 키는 안내 문구로', /키/.test(errMsg), errMsg);

  log.push({ name: 'app errors (window.__errors)', pass: (window.__errors || []).length === 0, detail: (window.__errors || []).slice(0, 3) });
} catch (e) {
  log.push({ name: 'FATAL', pass: false, detail: String((e && e.stack) || e) });
} finally {
  window.fetch = realFetch;
  for (const k of Object.keys(backup)) localStorage.setItem(k, backup[k]);
  for (const k of Object.keys(localStorage)) if (k.startsWith('aitutor.') && !(k in backup)) localStorage.removeItem(k);
}
const passed = log.filter(l => l.pass).length;
out.innerHTML = `<span class="${passed === log.length ? 'ok' : 'bad'}">${passed}/${log.length} 통과</span>\n` +
  log.map(l => `${l.pass ? '✓' : '✗'} ${l.name}\n    ${JSON.stringify(l.detail)}`).join('\n');
window.__testResult = { passed, total: log.length, log };
document.title = `TEST ${passed}/${log.length}`;
</script>
</body>
</html>
